# =============================================================================
#  Jarvis tools for Home Assistant
#
#  Put this file in /config/packages/ and make sure configuration.yaml has:
#
#    homeassistant:
#      packages: !include_dir_named packages
#
#  Then restart Home Assistant and EXPOSE these scripts to Assist:
#  Settings -> Voice assistants -> Expose -> + Expose entities -> pick the
#  "Jarvis ..." scripts. The AI can only use what is exposed.
#
#  Things to change for your home are marked  # <-- CHANGE
# =============================================================================

script:
  # ---------------------------------------------------------------- mood ----
  jarvis_set_mood:
    alias: Jarvis set mood
    icon: mdi:emoticon-outline
    mode: queued
    description: >-
      Show an emotion on Jarvis's animated face. Call this ONCE before every
      spoken reply, picking the emotion that fits the reply.
    fields:
      mood:
        name: Mood
        description: The emotion that matches your reply.
        required: true
        selector:
          select:
            options: [neutral, happy, excited, sad, angry, surprised, confused, sleepy, love]
    sequence:
      - action: esphome.jarvis_set_mood        # device name "jarvis" + action "set_mood"
        data:
          mood: "{{ mood }}"

  # -------------------------------------------------------- automations ----
  jarvis_create_automation:
    alias: Jarvis create automation
    icon: mdi:robot
    mode: single
    description: >-
      Create a new Home Assistant automation. ONLY call this after you have
      described the automation to the user in plain words and they said yes.
      automation_json must be ONE JSON object using current Home Assistant
      automation syntax, for example:
      {"alias": "[Jarvis] Porch light at sunset",
       "description": "Created by Jarvis",
       "triggers": [{"trigger": "sun", "event": "sunset"}],
       "conditions": [],
       "actions": [{"action": "light.turn_on", "target": {"entity_id": "light.porch"}}],
       "mode": "single"}
      Always start the alias with "[Jarvis] ". Use only real entity IDs you know
      exist. If the result says ok is false, read the details, fix the JSON and
      try once more, or explain the problem to the user.
    fields:
      automation_json:
        name: Automation JSON
        description: The complete automation as a JSON object (see the description).
        required: true
        selector:
          text:
            multiline: true
    sequence:
      - action: rest_command.jarvis_save_automation
        data:
          automation_id: "jarvis_{{ now().timestamp() | int }}"
          config: "{{ automation_json }}"
        response_variable: http
      - variables:
          result:
            ok: "{{ http.status == 200 }}"
            status: "{{ http.status }}"
            details: "{{ http.content }}"
      - stop: Done
        response_variable: result

  # ------------------------------------------------------------- ESPHome ----
  jarvis_draft_esphome_config:
    alias: Jarvis draft ESPHome config
    icon: mdi:chip
    mode: single
    description: >-
      Send the user a complete ESPHome YAML configuration for a new device as a
      Home Assistant notification, so they can paste it into the ESPHome Device
      Builder and install it. Use when the user asks you to make, write or set up
      an ESPHome device or sensor. Use current ESPHome syntax, !secret wifi_ssid
      and !secret wifi_password for Wi-Fi, and include api: and ota:. Never read
      the YAML out loud - just say it has been sent to Home Assistant, and mention
      any wiring the user must do.
    fields:
      device_name:
        name: Device name
        description: Short lowercase name with hyphens, e.g. "garage-door-sensor".
        required: true
        selector:
          text:
      yaml:
        name: YAML
        description: The full ESPHome configuration.
        required: true
        selector:
          text:
            multiline: true
      notes:
        name: Notes
        description: Wiring and setup notes for the user (pins, parts, steps).
        required: false
        selector:
          text:
            multiline: true
    sequence:
      - action: persistent_notification.create
        data:
          notification_id: "jarvis_esphome_{{ device_name | slugify }}"
          title: "Jarvis: ESPHome config for {{ device_name }}"
          message: |
            {{ notes if notes else '' }}

            **How to use:** ESPHome Device Builder -> + New device -> name it
            `{{ device_name }}` -> Skip -> Edit -> replace everything with:

            ```yaml
            {{ yaml }}
            ```
      - variables:
          result:
            sent: true
      - stop: Done
        response_variable: result

  # -------------------------------------------------------- send a guide ----
  jarvis_send_guide:
    alias: Jarvis send guide
    icon: mdi:book-open-variant
    mode: queued
    description: >-
      Send the user a detailed written answer: step-by-step DIY guides (for
      example how to build an ESPHome light switch, which parts to buy, wiring,
      soldering, flashing), long explanations, lists, recipes or code. Use this
      whenever the full answer is too long to speak. Then say one sentence out
      loud, e.g. "I've sent the full guide to your phone, sir."
    fields:
      title:
        name: Title
        description: Short title, e.g. "DIY ESPHome light switch".
        required: true
        selector:
          text:
      guide:
        name: Guide
        description: The full answer in Markdown (headings, numbered steps, parts list, code blocks).
        required: true
        selector:
          text:
            multiline: true
    sequence:
      - action: persistent_notification.create
        data:
          title: "Jarvis: {{ title }}"
          message: "{{ guide }}"
      # Also push it to your phone (Home Assistant Companion app). Remove these
      # lines if you don't use the app.
      - action: notify.notify                                   # <-- CHANGE to notify.mobile_app_<your_phone>
        continue_on_error: true
        data:
          title: "Jarvis: {{ title }}"
          message: "{{ guide[:900] }}{{ '... (full guide in Home Assistant notifications)' if guide | length > 900 else '' }}"
      - variables:
          result:
            sent: true
      - stop: Done
        response_variable: result

  # ------------------------------------------------------- your computer ----
  jarvis_computer_task:
    alias: Jarvis computer task
    icon: mdi:laptop
    mode: queued
    description: >-
      Hand a task to the AI agent running on the user's computer (it can read and
      write files in its work folder, write code, research, draft documents and
      more). Use when the user asks you to do something "on my computer", "in
      Claude" or "in Gemini", or anything that needs files or a real computer.
      Write the task as a complete, precise instruction. For anything that deletes,
      sends, buys or publishes something, confirm with the user first. The task runs
      in the background: tell the user you've started it - you will announce the
      result when it finishes.
    fields:
      task:
        name: Task
        description: The full instruction for the computer's AI agent.
        required: true
        selector:
          text:
            multiline: true
    sequence:
      - action: rest_command.jarvis_pc_task
        data:
          task: "{{ task }}"
        response_variable: http
      - variables:
          result:
            started: "{{ http.status == 202 }}"
            details: "{{ 'The task is running on the computer.' if http.status == 202 else 'Could not reach the computer (HTTP ' ~ http.status ~ '). Is the Jarvis PC agent running?' }}"
      - stop: Done
        response_variable: result

  # ---------------------------------------------------------- web search ----
  jarvis_web_search:
    alias: Jarvis web search
    icon: mdi:web
    mode: queued
    description: >-
      Search the internet for up-to-date information (news, prices, opening
      hours, sports results, recent events, facts you are unsure about).
      Returns an answer with the latest information.
    fields:
      query:
        name: Query
        description: What to search for, as a full question.
        required: true
        selector:
          text:
    sequence:
      - action: conversation.process
        data:
          agent_id: conversation.jarvis_search                  # <-- CHANGE to your search agent
          text: "{{ query }}"
        response_variable: answer
      - variables:
          result:
            answer: "{{ answer.response.speech.plain.speech }}"
      - stop: Done
        response_variable: result

# Lets Jarvis save automations through Home Assistant's own config API
# (the same one the automation editor uses). It needs a long-lived access token:
# Profile -> Security -> Long-lived access tokens -> Create, then add to secrets.yaml:
#   jarvis_ha_token: "Bearer eyJhbGciOi....."
rest_command:
  jarvis_pc_task:
    url: "http://192.168.1.50:8765/task"                         # <-- CHANGE to your computer's IP
    method: POST
    headers:
      Authorization: !secret jarvis_pc_token                     # "Bearer <same token as config.json>"
      Content-Type: application/json
    payload: '{{ {"task": task} | to_json }}'
    timeout: 10

  jarvis_save_automation:
    url: "http://127.0.0.1:8123/api/config/automation/config/{{ automation_id }}"  # use https:// if you set up SSL in HA
    method: POST
    headers:
      Authorization: !secret jarvis_ha_token
      Content-Type: application/json
    payload: "{{ config if config is string else (config | to_json) }}"
    timeout: 20

# When the computer finishes a task: Jarvis says the summary out loud and the full
# result appears in Home Assistant notifications.
automation:
  - id: jarvis_computer_task_done
    alias: "[Jarvis] Computer task finished"
    mode: queued
    triggers:
      - trigger: webhook
        webhook_id: jarvis_pc_done
        allowed_methods: [POST]
        local_only: true
    actions:
      - action: persistent_notification.create
        data:
          title: "Jarvis: computer task {{ 'done' if trigger.json.ok else 'failed' }}"
          message: |
            **Task:** {{ trigger.json.task }}

            **Result ({{ trigger.json.seconds }} s):**

            {{ trigger.json.output }}
      - action: assist_satellite.announce
        continue_on_error: true
        target:
          entity_id: assist_satellite.jarvis_assist_satellite     # <-- CHANGE if your entity ID differs
        data:
          message: >-
            {{ 'Sir, the task on your computer is done. ' if trigger.json.ok else 'Sir, the task on your computer ran into a problem. ' }}{{ trigger.json.summary }}
          preannounce: false
