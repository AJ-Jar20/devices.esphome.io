# OPTIONAL speed boost: Whisper + Piper on the mini PC (Ubuntu/Debian with Docker).
# Not needed if you run the Whisper and Piper add-ons on the Pi 5.
# Runs speech-to-text and text-to-speech locally. Home Assistant
# connects to these with the Wyoming Protocol integration.
#
#   docker compose up -d
#
# Then in Home Assistant: Settings -> Devices & services -> Add integration ->
# Wyoming Protocol -> host = <mini PC IP>, port 10300 (Whisper), then again with port 10200 (Piper).

services:
  whisper:
    image: rhasspy/wyoming-whisper:latest
    container_name: jarvis-whisper
    command: --model small-int8 --language en --beam-size 1
    ports:
      - "10300:10300"
    volumes:
      - ./data/whisper:/data
    restart: unless-stopped

  piper:
    image: rhasspy/wyoming-piper:latest
    container_name: jarvis-piper
    command: --voice en_GB-alan-medium
    ports:
      - "10200:10200"
    volumes:
      - ./data/piper:/data
    restart: unless-stopped

  # Optional: offline "private mode" brain. Works, but on an 8 GB mini PC
  # without a graphics card expect 10-30 s per answer. Uncomment to try:
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: jarvis-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ./data/ollama:/root/.ollama
  #   restart: unless-stopped
  # Then: docker exec -it jarvis-ollama ollama pull qwen3:4b
