# MediaMTX config for a Raspberry Pi Zero 2 W + Camera Module as Jarvis's eye.
# Only the parts that differ from MediaMTX's defaults.
# Stream URL for Home Assistant:  rtsp://<zero-ip>:8554/jarvis_eye

paths:
  jarvis_eye:
    source: rpiCamera
    rpiCameraWidth: 1280
    rpiCameraHeight: 720
    rpiCameraFPS: 10
