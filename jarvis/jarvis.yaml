# =============================================================================
#  J.A.R.V.I.S. - personal AI assistant with an animated eyes face
#  Board: Guition JC1060P470C_I_W_Y (7" 1024x600, ESP32-P4 + ESP32-C6)
#
#  On the device:  "Hey Jarvis" wake word, mic, speaker, animated face, timers
#  In Home Assistant: speech-to-text, the AI brain, text-to-speech and the
#  Jarvis tools (moods, camera vision, automations, ESPHome configs).
#  See README.md in this folder.
#
#  Hardware base taken from the community config:
#  https://github.com/p1ngb4ck/unofficial_guition_esp32p4_repo/tree/main/JC1060P470_I_W_Y
# =============================================================================

substitutions:
  name: jarvis
  friendly_name: Jarvis
  timezone: Asia/Muscat

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.12.0
  includes:
    - jarvis_face.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          face::begin(id(face_layer));
          face::set_activity(face::OFFLINE);

esp32:
  variant: esp32p4
  flash_size: 16MB
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true

psram:
  mode: hex
  speed: 200MHz

logger:
  hardware_uart: USB_SERIAL_JTAG

# ---------------------------------------------------------------- network ----
# Wi-Fi goes through the ESP32-C6 co-processor.
esp32_hosted:
  variant: ESP32C6
  active_high: true
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Jarvis Setup"

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key
  # Home Assistant calls these (the Jarvis tools in jarvis_package.yaml use them)
  actions:
    - action: set_mood
      variables:
        mood: string
      then:
        - lambda: face::set_emotion(mood);
    - action: show_text
      variables:
        message: string
      then:
        - lvgl.label.update:
            id: lbl_reply
            text: !lambda return message;
  on_client_connected:
    - micro_wake_word.start:
    - lambda: face::set_activity(face::IDLE);
  on_client_disconnected:
    - micro_wake_word.stop:
    - lambda: face::set_activity(face::OFFLINE);

ota:
  - platform: esphome
    password: !secret ota_password

time:
  - platform: homeassistant
    id: ha_time
    timezone: ${timezone}
    on_time:
      - seconds: 0
        then:
          - lvgl.label.update:
              id: lbl_clock
              text: !lambda return id(ha_time).now().strftime("%H:%M");

# ---------------------------------------------------------------- display ----
esp_ldo:
  - channel: 3
    voltage: 2.5V     # MIPI DSI PHY

output:
  - platform: ledc
    id: backlight_output
    pin: GPIO23

light:
  - platform: monochromatic
    id: backlight
    name: Screen Backlight
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

display:
  - platform: mipi_dsi
    id: main_display
    model: JC1060P470
    reset_pin: GPIO0
    update_interval: never
    auto_clear_enabled: false

i2c:
  - id: i2c_bus
    sda: GPIO7
    scl: GPIO8
    frequency: 400kHz
    sda_pullup_enabled: false
    scl_pullup_enabled: false

touchscreen:
  - platform: gt911
    id: touch
    i2c_id: i2c_bus

# ------------------------------------------------------------------ audio ----
switch:
  - platform: gpio
    id: speaker_amp
    name: Speaker Amplifier
    pin: GPIO11           # PA_CTRL
    restore_mode: ALWAYS_ON
  - platform: template
    id: timer_ringing
    name: Timer Ringing
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: face::set_emotion("surprised");
      - lvgl.label.update: { id: lbl_reply, text: "Timer finished, sir. Tap the screen to stop." }
      - while:
          condition:
            switch.is_on: timer_ringing
          then:
            - media_player.speaker.play_on_device_media_file:
                media_file: timer_sound
                announcement: true
            - wait_until:
                media_player.is_announcing:
            - wait_until:
                not:
                  media_player.is_announcing:
            - delay: 500ms
    on_turn_off:
      - media_player.stop:
          announcement: true
      - lambda: face::set_emotion("happy");

audio_dac:
  - platform: es8311
    id: es8311_codec
    i2c_id: i2c_bus
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 48000
    use_mclk: true
    use_microphone: true
    mic_gain: 24DB

i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12
    i2s_mclk_pin: GPIO13

microphone:
  - platform: i2s_audio
    id: board_mic
    i2s_audio_id: i2s_bus
    i2s_mode: primary
    adc_type: external
    i2s_din_pin: GPIO48
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: stereo

speaker:
  - platform: i2s_audio
    id: board_speaker
    i2s_audio_id: i2s_bus
    i2s_mode: primary
    i2s_dout_pin: GPIO9
    dac_type: external
    audio_dac: es8311_codec
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: left
    buffer_duration: 100ms
  - platform: mixer
    id: speaker_mixer
    output_speaker: board_speaker
    num_channels: 1
    task_stack_in_psram: true
    source_speakers:
      - id: announcement_mixer_input
      - id: media_mixer_input
  - platform: resampler
    id: announcement_resampler
    output_speaker: announcement_mixer_input
  - platform: resampler
    id: media_resampler
    output_speaker: media_mixer_input

media_player:
  - platform: speaker
    id: jarvis_player
    name: None
    task_stack_in_psram: true
    buffer_size: 1000000
    volume_initial: 70%
    announcement_pipeline:
      speaker: announcement_resampler
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    media_pipeline:
      speaker: media_resampler
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    files:
      - id: timer_sound
        file: sounds/timer.wav
    on_announcement:
      - if:
          condition:
            microphone.is_capturing:
          then:
            - micro_wake_word.stop:
    on_idle:
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - micro_wake_word.start:

# ------------------------------------------------------------ voice brain ----
micro_wake_word:
  id: mww
  microphone:
    microphone: board_mic
    channels: 0
  models:
    - model: hey_jarvis
      id: ww_hey_jarvis
  on_wake_word_detected:
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone:
    microphone: board_mic
    channels: 0
  media_player: jarvis_player
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_listening:
    - lambda: face::set_activity(face::LISTENING);
    - lvgl.label.update: { id: lbl_you, text: "" }
    - lvgl.label.update: { id: lbl_reply, text: "Listening..." }
  on_stt_vad_end:
    - lambda: face::set_activity(face::THINKING);
  on_stt_end:
    - lvgl.label.update:
        id: lbl_you
        text: !lambda |-
          std::string s = "\"" + x + "\"";
          return s;
    - lvgl.label.update: { id: lbl_reply, text: "" }
  on_tts_start:
    - lambda: |-
        face::guess_emotion(x);
        face::set_activity(face::SPEAKING);
    - lvgl.label.update:
        id: lbl_reply
        text: !lambda return x;
  on_error:
    - lambda: face::set_activity(face::ERROR);
    - lvgl.label.update:
        id: lbl_reply
        text: !lambda |-
          std::string s = "Hmm, something went wrong (" + code + ")";
          return s;
  on_end:
    # Let the spoken reply finish before listening for the wake word again
    - wait_until:
        condition:
          media_player.is_announcing:
        timeout: 0.5s
    - wait_until:
        not:
          media_player.is_announcing:
    - lambda: face::set_activity(face::IDLE);
    - micro_wake_word.start:
  # Timers ("Hey Jarvis, set a timer for 5 minutes")
  on_timer_started:
    - lvgl.label.update:
        id: lbl_reply
        text: !lambda |-
          char buf[64];
          snprintf(buf, sizeof(buf), "Timer set: %u min %u s", (unsigned) (timer.total_seconds / 60),
                   (unsigned) (timer.total_seconds % 60));
          return std::string(buf);
  on_timer_finished:
    - switch.turn_on: timer_ringing

# -------------------------------------------------------- face animation ----
interval:
  - interval: 33ms
    then:
      - lambda: face::tick(millis());

# Pick a mood by hand from Home Assistant (handy for testing the face)
select:
  - platform: template
    name: Face Mood
    id: face_mood
    optimistic: true
    options: [neutral, happy, excited, sad, angry, surprised, confused, sleepy, love]
    initial_option: neutral
    set_action:
      - lambda: face::set_emotion(x);

# ------------------------------------------------------------------- LVGL ----
font:
  - file: "gfonts://Rajdhani@600"
    id: font_text
    size: 28
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~°’‘“”…–—"
  - file: "gfonts://Rajdhani@500"
    id: font_small
    size: 22
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~°’‘“”…–—"

lvgl:
  displays: main_display
  touchscreens: touch
  buffer_size: 25%
  color_depth: 16
  bg_color: 0x000000
  default_font: font_text
  pages:
    - id: home
      bg_color: 0x000000
      scrollable: false
      widgets:
        # The eyes are drawn into this layer by jarvis_face.h.
        # Tapping anywhere on the face starts/stops listening (or stops a ringing timer).
        - obj:
            id: face_layer
            x: 0
            y: 0
            width: 1024
            height: 600
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            radius: 0
            scrollable: false
            on_click:
              - if:
                  condition:
                    switch.is_on: timer_ringing
                  then:
                    - switch.turn_off: timer_ringing
                  else:
                    - if:
                        condition: voice_assistant.is_running
                        then:
                          - voice_assistant.stop:
                        else:
                          - voice_assistant.start:

        - label:
            id: lbl_clock
            x: 28
            y: 18
            text: "--:--"
            text_font: font_small
            text_color: 0x4F6B73

        # Not shown - only here so ESPHome builds LVGL's line widget, used for the eyelids.
        - line:
            id: lvgl_line_enabler
            hidden: true
            points: [[0, 0], [1, 1]]

        # Subtitles under the eyes: what you said, then Jarvis's reply
        - label:
            id: lbl_you
            align: BOTTOM_MID
            y: -100
            width: 900
            long_mode: DOT
            text_align: CENTER
            text: ""
            text_font: font_small
            text_color: 0x5E8C93
        - label:
            id: lbl_reply
            align: BOTTOM_MID
            y: -24
            width: 940
            height: 72
            long_mode: DOT
            text_align: CENTER
            text: "Say \"Hey Jarvis\""
            text_color: 0xE0F7FA
